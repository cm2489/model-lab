name: bench

on:
  pull_request:
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (scheduler, progress, Eastern Time weeks, data fallback)
        working-directory: bench
        run: node --test test/*.test.js
